[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "openzeppelin-contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "solmate/=lib/solmate/",
]
solc_version = "0.8.34"
optimizer = true
optimizer_runs = 10000
via_ir = true

fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
sepolia = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"
mainnet = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
base = "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
robinhood = "https://robinhood-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
arbitrum = "https://arb-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"


[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
mainnet = { key = "${ETHERSCAN_API_KEY}" }
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
robinhood = { key = "${ETHERSCAN_API_KEY}", chain = 4663, url = "https://api.etherscan.io/v2/api?chainid=4663" }
arbitrum = { key = "${ETHERSCAN_API_KEY}", chain = 42161 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# TRON. Same sources and settings as the default build, targeting the TVM: probed on 2026-11-07
# (vault/tron `cli.mjs probe`), mainnet and Nile both run PUSH0, TSTORE/TLOAD and MCOPY, so cancun.
# Its own output directory, so the TRON deploy runner never reads an EVM artifact.
[profile.tron]
evm_version = "cancun"
out = "out-tron"
